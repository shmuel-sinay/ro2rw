name: Build RO2RW PC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mono-mcs mono-devel erofs-utils e2fsprogs android-sdk-libsparse-utils attr lz4 xz-utils cpio
      - name: Run core tests
        run: sudo bash tests/run-tests.sh "$RUNNER_TEMP/t"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE
        run: dotnet build src/RO2RW-PC.csproj -c Release -o out
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RO2RW-PC
          path: out/RO2RW-PC.exe
      - name: Publish dev build
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RO2RW PC (גרסת פיתוח)
          prerelease: true
          make_latest: false
          files: out/RO2RW-PC.exe
          body: |
            גרסת פיתוח שנבנתה אוטומטית מהקומיט ${{ github.sha }}.
            לגרסה היציבה ראו את המהדורה האחרונה.
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/RO2RW-PC.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RO2RW PC ${{ steps.ver.outputs.tag }}
          prerelease: false
          make_latest: true
          files: out/RO2RW-PC.exe
          body: |
            ## RO2RW PC ${{ steps.ver.outputs.tag }}

            ערכת כלים לווינדוס לעריכת רום של אנדרואיד, על המחשב בלבד.

            ### הורדה והפעלה
            1. הורידו את **RO2RW-PC.exe** מהקבצים למטה ושימו אותו בתיקייה משלו.
            2. הפעילו בלחיצה כפולה (Windows 10/11, בלי התקנה). אם מופיעה אזהרת SmartScreen: "מידע נוסף" ואז "הפעל בכל זאת".
            3. "פרויקט חדש": נותנים שם, בדרך כלל שם המכשיר.
            4. "הוסף קבצים" (או גרירה): super, boot / init_boot, vbmeta, lk.
            5. "בצע עריכה": הקבצים הערוכים נשמרים בתיקייה **ערוך** בתוך הפרויקט, עם אותם שמות.

            ### כלים
            - **RO2RW**: super.img ל-ext4 לקריאה וכתיבה (raw, sparse ומפוצל; EROFS ו-ext4)
            - **Root עם Magisk**: עריכת boot או init_boot על המחשב, כמו אפליקציית Magisk (ה-APK הרשמי יורד אוטומטית)
            - **ביטול AVB**: vbmeta עם verity ו-verification כבויים
            - **הסרת Orange State**: lk בלי ההשהיה של 5 שניות ובלי טקסט האזהרה

            ⚠️ גבו את המכשיר לפני הצריבה. האחריות על המשתמש.
