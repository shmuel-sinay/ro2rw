name: Build RO2RW PC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mono-mcs mono-devel erofs-utils e2fsprogs android-sdk-libsparse-utils attr lz4 xz-utils cpio
      - name: Run core tests
        run: sudo bash tests/run-tests.sh "$RUNNER_TEMP/t"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout mtkclient (pinned)
        uses: actions/checkout@v4
        with:
          repository: bkerler/mtkclient
          ref: 118a000a83ea31c4f427fe5225abfe964546e05e
          path: mtkclient-src
      - name: Build mtk.exe (PyInstaller)
        shell: pwsh
        working-directory: mtkclient-src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --noconfirm mtk_console.spec
          $exe = Get-ChildItem dist -Filter "mtk_console_*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force ../src/res | Out-Null
          Copy-Item $exe.FullName ../src/res/mtk.exe
          Copy-Item LICENSE ../src/res/mtkclient-LICENSE.txt
          ../src/res/mtk.exe --help | Select-Object -First 5
          if ($LASTEXITCODE -ne 0) { throw "mtk.exe does not start" }
      - name: Download official Magisk
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "RO2RW-PC" } https://api.github.com/repos/topjohnwu/Magisk/releases/latest
          $apk = $rel.assets | Where-Object { $_.name -match '^Magisk-v.*\.apk$' } | Select-Object -First 1
          if (-not $apk) { throw "Magisk apk not found" }
          Invoke-WebRequest $apk.browser_download_url -OutFile src/res/Magisk.apk
          Set-Content -NoNewline src/res/Magisk.version $rel.tag_name
          "Magisk $($rel.tag_name): $((Get-Item src/res/Magisk.apk).Length) bytes"
      - name: Build EXE
        run: dotnet build src/RO2RW-PC.csproj -c Release -o out
      - name: Check embedded tools
        shell: pwsh
        run: |
          $size = (Get-Item out/RO2RW-PC.exe).Length
          "RO2RW-PC.exe: $size bytes"
          if ($size -lt 20MB) { throw "mtk.exe / Magisk were not embedded" }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RO2RW-PC
          path: out/RO2RW-PC.exe
      - name: Publish dev build
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RO2RW PC (גרסת פיתוח)
          prerelease: true
          make_latest: false
          files: out/RO2RW-PC.exe
          body: |
            גרסת פיתוח שנבנתה אוטומטית מהקומיט ${{ github.sha }}.
            לגרסה היציבה ראו את המהדורה האחרונה.
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/RO2RW-PC.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RO2RW PC ${{ steps.ver.outputs.tag }}
          prerelease: false
          make_latest: true
          files: out/RO2RW-PC.exe
          body: |
            ## RO2RW PC ${{ steps.ver.outputs.tag }}

            ערכת כלים לווינדוס לעריכת רום של אנדרואיד, על המחשב בלבד.

            ### הורדה והפעלה
            1. הורידו את **RO2RW-PC.exe** מהקבצים למטה ושימו אותו בתיקייה משלו.
            2. הפעילו בלחיצה כפולה (Windows 10/11, בלי התקנה). אם מופיעה אזהרת SmartScreen: "מידע נוסף" ואז "הפעל בכל זאת".
            3. "פרויקט חדש": נותנים שם, בדרך כלל שם המכשיר.
            4. "הוסף קבצים" (או גרירה): super, boot / init_boot, vbmeta, lk.
            5. "בצע עריכה": הקבצים הערוכים נשמרים בתיקייה **ערוך** בתוך הפרויקט, עם אותם שמות.

            ### כלים
            - **שאיבת רום (mtkclient מובנה)**: שואב את כל המחיצות לתוך הפרויקט בשמות המחיצות, ויוצר scatter
            - **RO2RW**: super.img ל-ext4 לקריאה וכתיבה (raw, sparse ומפוצל; EROFS ו-ext4)
            - **Root עם Magisk (מובנה)**: עריכת boot או init_boot על המחשב, כמו אפליקציית Magisk. ה-ABI מזוהה אוטומטית
            - **ביטול AVB**: vbmeta עם verity ו-verification כבויים
            - **הסרת Orange State**: lk בלי ההשהיה של 5 שניות ובלי טקסט האזהרה

            ### שאיבה מהמכשיר
            בפעם הראשונה לוחצים "דרייבר USB" כדי להתקין את UsbDk. אחר כך: "שאב רום מהמכשיר", מכבים את המכשיר, מחזיקים את לחצני העוצמה ומחברים כבל.

            ### רכיבים מובנים ורישיונות
            - mtkclient מאת bkerler, ‏GPLv3: https://github.com/bkerler/mtkclient/tree/118a000a83ea31c4f427fe5225abfe964546e05e
            - Magisk מאת topjohnwu, ‏GPLv3: https://github.com/topjohnwu/Magisk (המהדורה הרשמית האחרונה בזמן הבנייה)

            ⚠️ גבו את המכשיר לפני הצריבה. האחריות על המשתמש.
